<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Snake rule-set test</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #0d1117; color: #f5f5f5; padding: 24px; }
    .wrap { background: #161b22; padding: 12px; margin: 12px 0; border-radius: 8px; overflow-x: auto; }
    .light { background: #fff; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Custom contribution snake — rule verification</h1>
  <pre id="report">running…</pre>
  <div class="wrap" id="dark"></div>
  <div class="wrap light" id="light"></div>
  <script type="module">
    import { mulberry32, mockCalendar, buildGrid, simulate, renderSvg } from "./profile/scripts/snake-core.mjs";

    const lines = [];
    let totalViolations = 0;
    for (const [seed, density] of [[1, 0.18], [2, 0.4], [3, 0.75], [4, 0.95], [5, 0.0], [6, 1.0]]) {
      const rng = mulberry32(seed);
      const board = buildGrid(mockCalendar(rng, density));
      const { path, greenSteps, violations } = simulate(board, 480, rng);
      totalViolations += violations;
      // extra independent check: every frame moves head by exactly 1 cell
      let badStep = 0;
      for (let i = 1; i < path.length; i++) {
        const a = path[i - 1][0], b = path[i][0];
        if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) !== 1) badStep++;
      }
      const green = board.grid.flat().filter(v => v > 0).length;
      lines.push(`seed ${seed} density ${density}: green ${green}/371, forced green moves ${greenSteps}, violations ${violations}, non-unit steps ${badStep}`);
    }
    lines.push(totalViolations === 0 ? "PASS — never stepped on green while an empty neighbour existed" : "FAIL");
    document.getElementById("report").textContent = lines.join("\n");
    console.log(lines.join("\n"));

    const rng = mulberry32(20260923);
    const board = buildGrid(mockCalendar(rng, 0.18));
    const { path } = simulate(board, 480, rng);
    document.getElementById("dark").innerHTML = renderSvg(board, path, "dark", "Kaan-Developer", { titles: false });
    document.getElementById("light").innerHTML = renderSvg(board, path, "light", "Kaan-Developer", { titles: false });
    console.log("svg bytes:", document.getElementById("dark").innerHTML.length);
  </script>
</body>
</html>

# .github/workflows/snake.yml
#
# Regenerates the contribution snake (dark + light SVG) and publishes it to the
# `output` branch, which the README loads from:
#   https://raw.githubusercontent.com/Kaan-Developer/Kaan-Developer/output/snake-dark.svg
#   https://raw.githubusercontent.com/Kaan-Developer/Kaan-Developer/output/snake-light.svg
#
# IMPORTANT
#   • This workflow must live in the special profile repository
#     github.com/Kaan-Developer/Kaan-Developer (same name as the account),
#     alongside README.md and scripts/generate-snake.mjs.
#   • Run it once by hand (Actions → "Contribution snake" → Run workflow)
#     right after pushing, otherwise the README shows broken images until the
#     first scheduled run.
#   • GitHub automatically DISABLES scheduled workflows after 60 days without
#     activity in the repository. Any commit to this repo re-enables it, or you
#     can re-enable it from the Actions tab. If the snake stops updating, this
#     is the first thing to check.

name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (off the hour to avoid the top-of-hour queue)
  workflow_dispatch: {}

permissions:
  contents: write # needed to push the `output` branch

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate snake SVGs
        run: node scripts/generate-snake.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          # SNAKE_FRAMES: "480"   # moves per loop — raise for a longer loop, lower for a smaller file

      - name: Publish to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
